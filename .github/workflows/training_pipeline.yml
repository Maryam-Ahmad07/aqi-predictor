name: Training Pipeline (daily)

on:
  schedule:
    - cron: "30 2 * * *"   # once a day at 02:30 UTC, after features have accumulated
  workflow_dispatch: {}

jobs:
  run-training-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run training pipeline
        run: python training_pipeline.py

      - name: Commit updated models & metrics
        run: |
          git config user.name "aqi-bot"
          git config user.email "aqi-bot@users.noreply.github.com"
          git add models/
          git diff --cached --quiet || git commit -m "Automated model retrain [skip ci]"
          git push
